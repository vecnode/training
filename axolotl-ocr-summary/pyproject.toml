[project]
name = "axolotl-fine-tuning"
version = "0.1.0"
description = "Axolotl fine-tuning workspace: OCR text -> summary text LoRA/QLoRA, scaling from a single RTX3090 24GB up"
requires-python = ">=3.10"
dependencies = [
  "axolotl[deepspeed]>=0.9.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "huggingface-hub>=0.25.0",
  "pandas>=2.2.0",
  "evaluate>=0.4.0",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4.0",
]

[tool.uv]
package = false

# Pin torch/torchvision to the CUDA 12.8 build. Without this, `uv sync` resolves
# the CPU-only wheel from PyPI and GPU training silently stops working.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
