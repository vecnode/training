[project]
name = "cifar10-vqvae"
version = "0.1.0"
description = "Custom VQ-VAE (encoder/vector-quantizer/decoder written by hand, torch autograd, EMA codebook updates) trained from scratch on CIFAR-10, reconstruction only"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "torch==2.11.0",
]
# No VQ-VAE library (no vqtorch, no lightning-bolts): the encoder, decoder,
# the vector quantizer's nearest-neighbor lookup / straight-through
# estimator, and the EMA codebook updates are all written out by hand as
# plain nn.Modules - torch is used only for tensor ops, autograd, and GPU
# execution, the same role it plays in training/mnist-vae and
# fine-tuning/*-lora. No Pillow needed either: the CIFAR-10 python pickles
# are parsed by hand (stdlib pickle) and the evaluation PNGs are written by
# hand (stdlib zlib/struct).
#
# This pipeline is the in-place successor of the former cifar10-vae (a
# plain VAE whose Gaussian-posterior averaging caused blur; a discrete
# codebook + straight-through estimator removes that mechanism). It is
# reconstruction-only (encode -> quantize -> decode a real image back) -
# no learned prior over the discrete codes, so it cannot sample novel
# images. That is deliberate scope: the 8x8 code grid is the substrate for
# a later learned prior (the planned cascade), and adding one means
# training a separate autoregressive/diffusion model over the code indices.

[tool.uv]
package = false

# Pin torch to the CUDA 12.8 build. Without this, `uv sync` resolves the
# CPU-only wheel from PyPI and GPU training silently stops working.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
