[project]
name = "fashion-mnist-dcgan"
version = "0.1.0"
description = "DCGAN (generator/discriminator, N(0,0.02) init, one-sided label smoothing written by hand, torch autograd) trained from scratch on Fashion-MNIST"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "torch==2.11.0",
]
# No torchvision/kagglehub/pytorch-gan-metrics or any prebuilt GAN library:
# the generator, discriminator, weight init, label smoothing, and the
# balanced D/G update loop are all written out by hand as plain nn.Modules -
# torch is used only for tensor ops, autograd, and GPU execution, the same
# role it plays in training/mnist-vae and fine-tuning/*-lora.

[tool.uv]
package = false

# Pin torch to the CUDA 12.8 build. Without this, `uv sync` resolves the
# CPU-only wheel from PyPI and GPU training silently stops working.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
