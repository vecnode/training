[project]
name = "gaussian-splatting"
version = "0.1.0"
description = "3D Gaussian Splatting (differentiable EWA splat rasterizer, adaptive densification, SH view-dependent colour written by hand, torch autograd) optimized from scratch per scene on NeRF-Synthetic / Blender"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "torch==2.11.0",
]
# No splatting library and no 3D/graphics stack at all: no gsplat, no
# diff-gaussian-rasterization (the reference CUDA rasterizer), no
# nerfstudio/threestudio, no COLMAP/pycolmap, no plyfile, no open3d, no
# trimesh - and no image library either (no Pillow, no torchvision, no
# OpenCV). The PNG decoder, the camera-convention conversion, the EWA
# projection of 3D covariances to 2D conics, the tile-binned alpha
# compositing, the spherical-harmonics colour evaluation, the adaptive
# densification (clone/split/prune/opacity-reset) with its optimizer-state
# surgery, SSIM, and the binary .ply writer are all written out by hand.
# torch supplies tensor ops, autograd, sorting and GPU execution - the same
# role it plays in training/rvq-audio-codec and training/flow-matching-mnist,
# which likewise write their own model and training loop rather than
# importing one.
#
# The rasterizer being plain PyTorch rather than a CUDA extension is the
# whole point of this folder: the alpha compositing is expressed as an
# exclusive cumprod so that autograd differentiates it, and no backward
# pass is hand-derived. It is slower than the reference kernel - see the
# README's "Cost" section for measured numbers - but the projection and
# compositing math stays readable, which the CUDA version does not.
#
# NeRF-Synthetic needs no structure-from-motion: the reference
# implementation initializes Blender scenes from uniform random points in a
# cube, not from an SfM point cloud, which is why COLMAP is absent above
# rather than merely unused.

[tool.uv]
package = false

# Pin torch to the CUDA 12.8 build. Without this, `uv sync` resolves the
# CPU-only wheel from PyPI and GPU training silently stops working.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
