[project]
name = "llava15-lora"
version = "0.1.0"
description = "LLaVA 1.5 7B LoRA fine-tuning (text-only OCR -> summary)"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33.0",
  "huggingface-hub>=0.25.0",
  "peft>=0.12.0",
  "pillow>=10.0.0",
  "sentencepiece>=0.2.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers>=4.45.0",
]

[tool.uv]
package = false

# Pin torch/torchvision to the CUDA 12.8 build. Without this, `uv sync` resolves
# the CPU-only wheel from PyPI and GPU training silently stops working.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
