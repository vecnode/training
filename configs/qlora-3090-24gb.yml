# QLoRA fine-tune, sized for a single RTX 3090 (24GB VRAM).
# Target task: OCR text -> summary text.
# Swap base_model for anything in the 7-8B class; 4-bit quantization is what
# makes this fit in 24GB alongside optimizer state and activations.

base_model: Qwen/Qwen2.5-7B-Instruct

load_in_4bit: true
adapter: qlora
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true

datasets:
  - path: DATASET_JSONL/train.jsonl
    type: alpaca
    ds_type: json

test_datasets:
  - path: DATASET_JSONL/val.jsonl
    type: alpaca
    ds_type: json
    split: train

output_dir: ./output/qlora-3090-24gb

sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 3

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002
warmup_steps: 10

bf16: auto
tf32: true
flash_attention: true
gradient_checkpointing: true

eval_steps: 50
save_steps: 100
logging_steps: 5
save_total_limit: 3

special_tokens:
  pad_token: "<|endoftext|>"
